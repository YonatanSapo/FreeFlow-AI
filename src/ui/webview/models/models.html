<!DOCTYPE html>
<html lang="en" data-platform="{{platform}}">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
	<link rel="stylesheet" href="{{styleUri}}" />
	<title>FreeFlow-AI Models</title>
</head>
<body>
	<header class="toolbar">
		<h2>Manage Models</h2>
	</header>
	<div class="models-scroll">
		<section>
			<h3 class="section-heading">
				<span id="ollamaDot" class="dot initializing" title="Checking Ollama…"></span>
				<span>Local Models (Ollama)</span>
				<span id="ollamaStatus" class="section-status">Checking…</span>
			</h3>
			<div id="ollamaInstructions" class="instructions hidden"></div>
			<ul id="localList" class="list"></ul>
		</section>
		<section id="runningSection" class="hidden">
			<h3 class="section-heading">
				<span class="dot running" title="loaded in memory"></span>
				<span>Running (in memory)</span>
			</h3>
			<ul id="runningList" class="list"></ul>
		</section>
	</div>
	<div id="toast" class="toast hidden"></div>
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
