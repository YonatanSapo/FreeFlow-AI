<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
	<link rel="stylesheet" href="{{styleUri}}" />
	<title>PromptRouter Models</title>
</head>
<body>
	<header class="toolbar">
		<h2>Models</h2>
		<button id="refreshBtn" type="button">Refresh</button>
	</header>
	<section>
		<h3>Ollama Daemon</h3>
		<div id="ollamaRow" class="row daemon-row"></div>
		<div id="ollamaInstructions" class="instructions hidden"></div>
	</section>
	<section>
		<h3>Local Models (Ollama)</h3>
		<ul id="localList" class="list"></ul>
	</section>
	<section>
		<h3>Cloud Models</h3>
		<ul id="cloudList" class="list"></ul>
	</section>
	<div id="toast" class="toast hidden"></div>
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
