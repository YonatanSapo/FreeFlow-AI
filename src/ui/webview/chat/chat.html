<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
	<link rel="stylesheet" href="{{styleUri}}" />
	<title>PromptRouter Chat</title>
</head>
<body>
	<div id="banner" class="banner hidden" role="alert">
		<span id="bannerText"></span>
		<button id="bannerRetry" type="button">Retry</button>
	</div>
	<header class="toolbar">
		<label for="modelSelect" class="sr-only">Model</label>
		<select id="modelSelect" aria-label="Model"></select>
		<button id="refreshBtn" type="button" title="Refresh models">Refresh</button>
	</header>
	<main id="messages" class="messages" aria-live="polite"></main>
	<footer class="composer">
		<textarea id="input" rows="3" placeholder="Ask something… (Ctrl/Cmd+Enter to send)"></textarea>
		<div class="composer-actions">
			<button id="sendBtn" type="button">Send</button>
			<button id="cancelBtn" type="button" class="hidden">Stop</button>
		</div>
	</footer>
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
